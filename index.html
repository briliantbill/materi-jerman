<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materi Bahasa Jerman</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    padding: 16px;
    box-sizing: border-box;
    display: grid;
    place-items: center;
    background: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a {
    display: block;
    width: 100%;
    max-width: 420px;
    box-sizing: border-box;
    padding: 16px 20px;
    border-radius: 12px;
    background: #1a1a1a;
    color: #fff;
    text-align: center;
    text-decoration: none;
    font-size: 17px;
    font-weight: 600;
  }
  a:hover { background: #333; }
  @media (prefers-color-scheme: dark) {
    body { background: #111; }
    a { background: #fff; color: #111; }
    a:hover { background: #ddd; }
  }
</style>
</head>
<body>

</html>
