<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materi Bahasa Jerman</title>
<meta name="description" content="Klik untuk membuka materi belajar Bahasa Jerman di Google Drive.">

<!-- Pratinjau saat link dibagikan (WhatsApp, Instagram, Telegram, dll.) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://materi-jerman-nu.vercel.app/">
<meta property="og:title" content="Materi Bahasa Jerman">
<meta property="og:description" content="Klik untuk membuka materi belajar Bahasa Jerman di Google Drive.">
<meta property="og:image" content="https://materi-jerman-nu.vercel.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Materi Bahasa Jerman">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 3'%3E%3Crect width='3' height='1' fill='%23000'/%3E%3Crect y='1' width='3' height='1' fill='%23D00'/%3E%3Crect y='2' width='3' height='1' fill='%23FFCE00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka:wght@500;600&display=swap">
<style>
  :root {
    --bg: #faf6ee;
    --glow-gold: rgba(255, 206, 0, .20);
    --glow-red: rgba(221, 0, 0, .08);
    --c1: #1a1a1a;
    --c2: #d40000;
    --c3: #c49500;
    --green: #1d7a45;
    --muted: #6a6458;
    --veil: rgba(250, 246, 238, .9);
    --chip: rgba(255, 255, 255, .9);
    --tip-bg: #fff;
    --tip-line: #e4dccb;
    --snow: #9fb4cf;
    --btn-bg: #1a1a1a;
    --btn-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121110;
      --glow-gold: rgba(255, 206, 0, .10);
      --glow-red: rgba(221, 0, 0, .14);
      --c1: #f2eee6;
      --c2: #ff5c5c;
      --c3: #ffd23f;
      --green: #5fd394;
      --muted: #a8a194;
      --veil: rgba(18, 17, 16, .9);
      --chip: rgba(34, 32, 29, .92);
      --tip-bg: #1e1c19;
      --tip-line: #3a3630;
      --snow: #ffffff;
      --btn-bg: #fff;
      --btn-text: #111;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 16px;
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(60% 50% at 12% 8%, var(--glow-gold), transparent 70%),
      radial-gradient(55% 45% at 92% 95%, var(--glow-red), transparent 70%),
      var(--bg);
    font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* ---------- Kalimat yang melayang ---------- */
  .sky { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .phrase {
    position: absolute;
    bottom: 0;
    left: var(--x);
    translate: calc(var(--x) * -1) 0;   /* kalimat tidak keluar dari layar */
    white-space: nowrap;
    font-size: var(--size);
    font-weight: 500;
    color: var(--color);
    filter: blur(var(--blur));
    opacity: 0;
    animation: rise var(--dur) linear var(--delay) infinite;
    will-change: transform, opacity;
    pointer-events: auto;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .phrase.hand { font-family: "Caveat", cursive; font-weight: 700; }
  .phrase span {
    display: inline-block;
    animation: sway var(--sway-dur) ease-in-out infinite alternate;
  }
  .phrase:hover { filter: none; }
  .phrase:hover span { text-decoration: underline dotted; text-underline-offset: 5px; }
  /* Kalimat yang sedang diketuk: berhenti, jelas, dan di atas semua kalimat lain */
  .phrase.active { opacity: 1 !important; filter: none; z-index: 2; }
  .phrase.active, .phrase.active span { animation-play-state: paused; }
  .phrase.active span {
    background: var(--chip);
    border-radius: 8px;
    padding: 0 8px;
    margin: 0 -8px;
    text-decoration: none;
    box-shadow: 0 6px 16px -8px rgba(0, 0, 0, .35);
  }
  @keyframes rise {
    0%   { transform: translateY(100%); opacity: 0; }
    10%  { opacity: var(--o); }
    85%  { opacity: var(--o); }
    100% { transform: translateY(calc(-100vh - 20px)); opacity: 0; }
  }
  @keyframes sway {
    from { transform: translateX(calc(var(--sway) * -1)) rotate(-2deg); }
    to   { transform: translateX(var(--sway)) rotate(2deg); }
  }

  /* Bayangan lembut di belakang tombol supaya tetap mudah dibaca */
  .veil {
    position: absolute;
    z-index: 1;
    left: 50%;
    top: 50%;
    width: min(680px, 150vw);
    height: 340px;
    translate: -50% -50%;
    background: radial-gradient(closest-side, var(--veil), transparent);
  }

  /* ---------- Salju (hanya Desember) ---------- */
  .snow { position: fixed; inset: 0; z-index: 4; overflow: hidden; pointer-events: none; }
  .flake {
    position: absolute;
    top: -12px;
    left: var(--x);
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    background: var(--snow);
    opacity: var(--o);
    animation: fall var(--dur) linear var(--delay) infinite;
  }
  @keyframes fall {
    to { transform: translate3d(var(--drift), calc(100vh + 24px), 0); }
  }

  /* ---------- Tombol ---------- */
  .center {
    position: relative;
    z-index: 3;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 18px 22px;
    border-radius: 14px;
    background: var(--btn-bg);
    color: var(--btn-text);
    text-decoration: none;
    font-size: 18px;
    font-weight: 600;
    box-shadow: 0 12px 30px -12px rgba(0, 0, 0, .5);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .link:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -14px rgba(0, 0, 0, .55); }
  .link:active { transform: scale(.99); }
  .link:focus-visible { outline: 3px solid #ffce00; outline-offset: 3px; }
  .flag {
    flex: none;
    width: 22px;
    height: 15px;
    border-radius: 3px;
    background: linear-gradient(to bottom, #1a1a1a 0 33.33%, #dd0000 33.33% 66.66%, #ffce00 66.66% 100%);
    box-shadow: 0 0 0 1px rgba(128, 128, 128, .4);
  }
  .hint {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    transition: opacity .4s ease;
  }
  .hint.hidden { opacity: 0; }

  /* ---------- Kotak arti ---------- */
  .tip {
    position: fixed;
    z-index: 10;
    left: 0;
    top: 0;
    max-width: min(320px, calc(100vw - 24px));
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 10px 10px 14px;
    border-radius: 14px;
    background: var(--tip-bg);
    border: 1.5px solid var(--tip-line);
    box-shadow: 0 14px 32px -14px rgba(0, 0, 0, .45);
    opacity: 0;
    transform: translateY(4px);
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
  }
  .tip.show { opacity: 1; transform: none; pointer-events: auto; }
  .tip-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tip-de { font-size: 17px; font-weight: 600; color: var(--c1); }
  .tip-id { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; color: var(--muted); }
  .tip-play {
    flex: none;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1.5px solid var(--tip-line);
    background: transparent;
    color: var(--c1);
    cursor: pointer;
  }
  .tip-play[hidden] { display: none; }
  .tip-play svg { width: 18px; height: 18px; }
  .tip-play:focus-visible { outline: 3px solid #ffce00; outline-offset: 2px; }

  /* Kalau HP/laptop diatur untuk mengurangi animasi: kalimat diam, tanpa salju */
  @media (prefers-reduced-motion: reduce) {
    .phrase { animation: none; opacity: var(--o); bottom: auto; top: var(--y); }
    .phrase span { animation: none; }
    .snow { display: none; }
    .link, .tip, .hint { transition: none; }
  }
</style>
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true">
    <div class="veil"></div>
  </div>
  <div class="snow" id="snow" aria-hidden="true" hidden></div>

  <main class="center">
    <a class="link" href="https://drive.google.com/drive/folders/1jawllV2q5L7A7ucaIhH2b4kXKeHDB0Ix?usp=drive_link">
      <span class="flag" aria-hidden="true"></span>
      Buka Google Drive
    </a>
    <p class="hint" id="hint">Ketuk kalimat yang melayang untuk melihat artinya</p>
  </main>

  <div class="tip" id="tip" role="status" aria-live="polite">
    <div class="tip-text">
      <span class="tip-de" id="tipDe" lang="de"></span>
      <span class="tip-id" id="tipId"></span>
    </div>
    <button class="tip-play" id="tipPlay" type="button" aria-label="Dengar pengucapan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
  </div>

<script>
  // Kalimat yang melayang: [Bahasa Jerman, arti Bahasa Indonesia]. Boleh ditambah atau diganti.
  const KALIMAT = [
    ["Hallo!", "Halo!"],
    ["Guten Morgen!", "Selamat pagi!"],
    ["Guten Tag!", "Selamat siang!"],
    ["Guten Abend!", "Selamat malam!"],
    ["Gute Nacht!", "Selamat tidur!"],
    ["Wie geht's?", "Apa kabar?"],
    ["Mir geht's gut.", "Kabarku baik."],
    ["Danke schön!", "Terima kasih banyak!"],
    ["Bitte schön!", "Sama-sama!"],
    ["Entschuldigung!", "Permisi! / Maaf!"],
    ["Tschüss!", "Dadah!"],
    ["Bis bald!", "Sampai jumpa lagi!"],
    ["Bis morgen!", "Sampai besok!"],
    ["Freut mich!", "Senang berkenalan!"],
    ["Herzlich willkommen!", "Selamat datang!"],
    ["Ich lerne Deutsch.", "Aku belajar bahasa Jerman."],
    ["Ich spreche ein bisschen Deutsch.", "Aku bisa sedikit bahasa Jerman."],
    ["Wie heißt du?", "Siapa namamu?"],
    ["Woher kommst du?", "Kamu berasal dari mana?"],
    ["Ich komme aus Indonesien.", "Aku berasal dari Indonesia."],
    ["Wo wohnst du?", "Kamu tinggal di mana?"],
    ["Alles klar!", "Oke, paham!"],
    ["Kein Problem.", "Tidak masalah."],
    ["Noch einmal, bitte.", "Sekali lagi, ya."],
    ["Ich verstehe.", "Aku mengerti."],
    ["Wie bitte?", "Maaf, apa tadi?"],
    ["Viel Erfolg!", "Semoga sukses!"],
    ["Viel Spaß!", "Selamat bersenang-senang!"],
    ["Prost!", "Bersulang!"],
    ["Deutsch macht Spaß!", "Bahasa Jerman itu seru!"],
    ["Übung macht den Meister.", "Latihan membuat jadi ahli."],
    ["Wie spät ist es?", "Jam berapa sekarang?"],
    ["Ich habe Hunger.", "Aku lapar."],
    ["Schönes Wochenende!", "Selamat berakhir pekan!"],
    ["Alles Gute!", "Semoga semuanya lancar!"],
    ["Na klar!", "Tentu saja!"],
    ["Genau!", "Betul sekali!"],
    ["Sprechen Sie Deutsch?", "Apakah Anda bisa bahasa Jerman?"],
  ];

  // Kalimat tambahan yang muncul 1 Desember – 1 Januari (bersama salju)
  const KALIMAT_NATAL = [
    ["Frohe Weihnachten!", "Selamat Natal!"],
    ["Frohes neues Jahr!", "Selamat Tahun Baru!"],
    ["Guten Rutsch!", "Selamat menyambut Tahun Baru!"],
    ["Schöne Feiertage!", "Selamat berlibur!"],
    ["Fröhliche Adventszeit!", "Selamat masa Adven!"],
    ["Es schneit!", "Turun salju!"],
    ["Der Weihnachtsmarkt ist schön.", "Pasar Natal-nya indah."],
    ["Ich trinke heiße Schokolade.", "Aku minum cokelat panas."],
    ["Wir backen Plätzchen.", "Kami membuat kue kering."],
    ["Der Schneemann ist lustig.", "Manusia saljunya lucu."],
    ["Alles Gute im neuen Jahr!", "Semoga sukses di tahun baru!"],
  ];

  (function () {
    const $ = (id) => document.getElementById(id);
    const sky = $("sky");
    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const WARNA = ["var(--c1)", "var(--c2)", "var(--c3)"];
    const WARNA_NATAL = ["var(--c2)", "var(--green)", "var(--c3)"];
    const kurangiAnimasi = matchMedia("(prefers-reduced-motion: reduce)").matches;

    // ---------- Musim Natal: otomatis 1 Desember – 1 Januari ----------
    // Untuk mencoba: tambahkan ?musim=natal atau ?musim=normal di akhir alamat
    const sekarang = new Date();
    let natal = sekarang.getMonth() === 11 || (sekarang.getMonth() === 0 && sekarang.getDate() === 1);
    const musim = new URLSearchParams(location.search).get("musim");
    if (musim === "natal") natal = true;
    if (musim === "normal") natal = false;

    // Kalimat diambil bergiliran secara acak supaya jarang berulang
    const tumpukan = (daftar) => {
      let sisa = [];
      return () => {
        if (!sisa.length) sisa = [...daftar].sort(() => Math.random() - 0.5);
        return sisa.pop();
      };
    };
    const ambilBiasa = tumpukan(KALIMAT);
    const ambilNatal = tumpukan(KALIMAT_NATAL);

    // ---------- Kalimat melayang ----------
    const jumlah = Math.round(Math.min(24, Math.max(12, (innerWidth * innerHeight) / 45000)));
    const jalur = Math.max(2, Math.round(innerWidth / 180));

    // Isi ulang kalimat, posisi, dan warna (dipanggil tiap kali kalimat sampai di atas)
    function acak(el) {
      const kalimatNatal = natal && Math.random() < 0.5;
      el.kalimat = kalimatNatal ? ambilNatal() : ambilBiasa();
      el.classList.toggle("hand", Math.random() < 0.35);
      const tulisanTangan = el.classList.contains("hand");
      const ukuran = (14 + el.depth * 16) * (tulisanTangan ? 1.3 : 1);
      el.style.setProperty("--size", ukuran.toFixed(1) + "px");
      el.style.setProperty("--x", (((el.jalur + rand(0.1, 0.9)) / jalur) * 100).toFixed(1) + "%");
      el.style.setProperty("--y", rand(3, 92).toFixed(1) + "%");
      el.style.setProperty("--color", pick(kalimatNatal ? WARNA_NATAL : WARNA));
      el.firstChild.textContent = el.kalimat[0];
    }

    for (let i = 0; i < jumlah; i++) {
      const el = document.createElement("div");
      el.className = "phrase";
      el.lang = "de";
      el.appendChild(document.createElement("span"));
      el.jalur = i % jalur;
      // depth: 0 = jauh (kecil, pudar, lambat), 1 = dekat (besar, jelas, cepat)
      el.depth = Math.random();
      const durasi = 30 - el.depth * 14;
      el.style.setProperty("--dur", durasi.toFixed(1) + "s");
      // posisi awal disebar merata dari bawah ke atas
      el.style.setProperty("--delay", (-((i + rand(0, 0.7)) / jumlah) * durasi).toFixed(1) + "s");
      el.style.setProperty("--o", (0.16 + el.depth * 0.4).toFixed(2));
      el.style.setProperty("--blur", el.depth < 0.3 ? "1px" : "0px");
      el.style.setProperty("--sway", rand(6, 18).toFixed(0) + "px");
      el.style.setProperty("--sway-dur", rand(3, 6).toFixed(1) + "s");
      acak(el);
      el.addEventListener("animationiteration", (e) => {
        // kalimat yang sedang dibuka artinya tidak boleh berganti
        if (e.target === el && e.animationName === "rise" && !el.classList.contains("active")) acak(el);
      });
      sky.appendChild(el);
    }

    // ---------- Salju ----------
    if (natal && !kurangiAnimasi) {
      const snow = $("snow");
      const banyak = Math.round(Math.min(70, Math.max(30, innerWidth / 14)));
      for (let i = 0; i < banyak; i++) {
        const f = document.createElement("i");
        f.className = "flake";
        const durasi = rand(9, 18);
        f.style.setProperty("--x", rand(0, 100).toFixed(1) + "%");
        f.style.setProperty("--s", rand(3, 7).toFixed(1) + "px");
        f.style.setProperty("--o", rand(0.45, 0.9).toFixed(2));
        f.style.setProperty("--dur", durasi.toFixed(1) + "s");
        f.style.setProperty("--delay", (-rand(0, durasi)).toFixed(1) + "s");
        f.style.setProperty("--drift", rand(-40, 40).toFixed(0) + "px");
        snow.appendChild(f);
      }
      snow.hidden = false;
    }

    // ---------- Suara Jerman ----------
    // Hanya memakai suara berbahasa Jerman; kalau perangkat tidak punya, tombol suara disembunyikan
    let suara = null;
    function cariSuara() {
      const semua = speechSynthesis.getVoices();
      const jerman = semua.filter((v) => /^de([-_]|$)/i.test(v.lang));
      suara = jerman.find((v) => /google|natural|online|premium|enhanced/i.test(v.name)) || jerman[0] || null;
    }
    if ("speechSynthesis" in window) {
      cariSuara();
      speechSynthesis.onvoiceschanged = cariSuara;
    }
    function ucapkan(teks) {
      if (!suara) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(teks);
      u.voice = suara;
      u.lang = suara.lang;
      u.rate = 0.9;
      speechSynthesis.speak(u);
    }

    // ---------- Ketuk kalimat → arti ----------
    const tip = $("tip");
    const tipPlay = $("tipPlay");
    let aktif = null;
    let timer;

    function mulaiTimer() {
      clearTimeout(timer);
      timer = setTimeout(tutup, 5000);
    }

    function tutup() {
      clearTimeout(timer);
      if (aktif) aktif.classList.remove("active");
      aktif = null;
      tip.classList.remove("show");
    }

    function posisikan(el) {
      const r = el.getBoundingClientRect();
      const t = tip.getBoundingClientRect();
      const kiri = Math.max(12, Math.min(r.left + r.width / 2 - t.width / 2, innerWidth - t.width - 12));
      let atas = r.top - t.height - 10;
      if (atas < 12) atas = r.bottom + 10;
      tip.style.left = kiri + "px";
      tip.style.top = atas + "px";
    }

    function buka(el) {
      if (aktif === el) { ucapkan(el.kalimat[0]); mulaiTimer(); return; }
      tutup();
      aktif = el;
      el.classList.add("active");
      $("tipDe").textContent = el.kalimat[0];
      $("tipId").textContent = el.kalimat[1];
      tipPlay.hidden = !suara;
      tip.classList.add("show");
      posisikan(el);
      ucapkan(el.kalimat[0]);
      $("hint").classList.add("hidden");
      mulaiTimer();
    }

    sky.addEventListener("click", (e) => {
      const el = e.target.closest(".phrase");
      if (el) buka(el);
    });
    tipPlay.addEventListener("click", () => {
      if (aktif) { ucapkan(aktif.kalimat[0]); mulaiTimer(); }
    });
    document.addEventListener("click", (e) => {
      if (aktif && !e.target.closest(".phrase, .tip")) tutup();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") tutup();
    });
  })();
</script>
</body>
</html>
